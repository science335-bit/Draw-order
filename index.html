<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Jua&family=Gamja+Flower&display=swap" rel="stylesheet">
<title>치이카와 계주 뽑기</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Gamja Flower","Jua","Malgun Gothic",sans-serif;font-size:18px;color:#5a3a22;background:#fff6e9 radial-gradient(#ffe0ec 2.5px,transparent 3px) 0 0/34px 34px;min-height:100vh;position:relative;overflow-x:hidden}
header{background:#fff0c8;border-bottom:5px solid #ffd54a;text-align:center;padding:14px 8px 12px;position:relative;z-index:1}
h1{margin:0;font-family:"Jua",sans-serif;font-size:30px;color:#e0357f;letter-spacing:3px}
header p{margin:4px 0 0;color:#8a4b12;font-size:17px}
.wrap{max-width:980px;margin:0 auto;padding:18px 14px 70px;position:relative;z-index:1}
.panel{background:#fff;border:4px solid #f9c8dd;border-radius:26px;padding:16px 18px;box-shadow:0 8px 18px rgba(240,120,170,.18);margin-bottom:18px}
.panel h2,.card h2{margin:0 0 8px;font-family:"Jua",sans-serif;font-size:20px;font-weight:400}
.panel h2{color:#5a3a22}
.edit{display:flex;gap:14px;flex-wrap:wrap}
.edit textarea{flex:1 1 320px}
.btns{display:flex;flex-direction:column;gap:10px;min-width:170px}
textarea{width:100%;height:104px;border:3px solid #f6b3d0;border-radius:18px;padding:10px 12px;font-family:inherit;font-size:19px;color:#5a3a22;resize:vertical;background:#fffafc}
button{font-family:"Jua",sans-serif;font-size:19px;border:0;border-radius:16px;padding:11px 18px;color:#fff;cursor:pointer;background:#ea4c9a;box-shadow:0 5px 0 #b9276f;transition:transform .08s}
button:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 #b9276f}
button.sub{background:#fbbf24;color:#5a3a22;box-shadow:0 5px 0 #d58b0a}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,textarea:focus-visible{outline:3px solid #2b6cff;outline-offset:2px}
.foot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:10px;font-size:16px}
#cnt{color:#e0357f}
.card{background:#e6efd9;border:4px solid #8fdca6;border-radius:26px;padding:14px 16px 18px;box-shadow:0 8px 18px rgba(80,170,110,.2);margin-bottom:18px}
.card .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.card h2{color:#15693a;margin:0}
#msg{background:#fff;border:3px solid #8fdca6;border-radius:999px;padding:3px 16px;font-size:17px;color:#15693a;min-height:0;text-align:center}
#track{position:relative;border-radius:20px;overflow:hidden;background:#d9534f;border:0;box-shadow:inset 0 6px 0 rgba(0,0,0,.12)}
.lane{position:relative;height:96px;border-bottom:3px dashed #fff}
.lane:last-child{border-bottom:0}
.start,.finish{position:absolute;top:0;bottom:0}
.start{left:70px;width:4px;background:#fff;opacity:.9}
.finish{right:40px;width:24px;background:repeating-conic-gradient(#222 0 25%,#fff 0 50%) 0 0/12px 12px}
.runner{transform-origin:0 0;position:absolute;left:0;top:2px;width:84px;height:96px;text-align:center;will-change:transform}
.runner svg{display:block;overflow:visible;margin-top:2px}
.bib{position:absolute;left:50%;top:58px;transform:translateX(-50%);min-width:48px;max-width:84px;background:#fff;color:#5a3a22;border:2px solid #ea4c9a;border-radius:999px;font-family:"Jua",sans-serif;font-size:14px;line-height:1.3;padding:0 8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bounce svg{animation:hop .24s infinite alternate ease-in-out}
@keyframes hop{to{transform:translateY(-6px)}}
#result ol{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
#result li{display:flex;align-items:center;gap:10px;background:#fff0f6;border:3px solid #f9c8dd;border-radius:18px;padding:6px 12px}
#result li img{width:46px;height:46px;object-fit:contain}
.rank{font-family:"Jua",sans-serif;font-size:22px;min-width:46px;color:#e0357f}
.nm{font-size:20px;word-break:break-all}
#result li.first{background:#fff3b8;border-color:#fbbf24}
.deco{position:fixed;font-size:34px;pointer-events:none;z-index:0;opacity:.85;animation:fl 5s infinite alternate ease-in-out}
@keyframes fl{to{transform:translateY(-14px) rotate(8deg)}}
.grass{position:fixed;left:0;right:0;bottom:0;height:34px;z-index:0;background:radial-gradient(circle at 12px 34px,#8fdca6 16px,transparent 17px) 0 0/24px 34px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.bounce svg,.deco{animation:none}}
</style></head><body>
<span class="deco" style="left:3%;top:150px" aria-hidden="true">☁️</span>
<span class="deco" style="right:3%;top:210px;animation-delay:-2s" aria-hidden="true">⭐</span>
<span class="deco" style="left:2%;top:520px;animation-delay:-1s" aria-hidden="true">🌸</span>
<span class="deco" style="right:2%;top:640px;animation-delay:-3s" aria-hidden="true">🍀</span>
<div class="grass" aria-hidden="true"></div>
<header><h1>🎽 치이카와 체육대회 계주 뽑기 🏁</h1><p>이름이나 숫자를 적고 계주 레이스로 순위를 뽑아보세요!</p></header>
<div class="wrap">
<div class="panel">
<h2><label for="names">✏️ 참가자 명단 (쉼표 또는 줄바꿈으로 구분)</label></h2>
<div class="edit"><textarea id="names" placeholder="예) 1번&#10;2번&#10;김철수">1번
2번
3번
4번</textarea>
<div class="btns"><button id="reset" class="sub">🏃 달리기 준비</button><button id="go">🚀 출발 신호!</button><button id="bgm" class="sub" aria-pressed="false">🎵 음악 켜기</button></div></div>
<div class="foot"><span>💡 최소 2명 ~ 최대 20명까지 달려요! (9명부터는 친구들이 번갈아 같이 나와요)</span><span id="cnt"></span></div>
</div>
<div class="card"><div class="top"><h2>🚩 대결 트랙</h2><div id="msg" aria-live="polite"></div></div>
<div id="track" aria-label="계주 트랙"></div></div>
<div class="panel" id="result" hidden><h2>🏆 결과 (결승선 도착 순서)</h2><ol id="list"></ol></div>
</div>

const FH=[0.776, 0.824, 0.882, 0.94, 0.855, 0.833, 0.718, 0.973];
const COL=["#ffffff","#ffffff","#fbeab8","#ffffff","#f3cf9e","#fbefd5","#fdd9a0","#fbe3e3"];
const MAX=20;let S=1;
const $=id=>document.getElementById(id);
let runners=[],raf=0,running=false;
function parse(){
  return $("names").value.split(/[\n,]+/).map(s=>s.trim()).filter(Boolean).slice(0,MAX);
}
function setup(){
  cancelAnimationFrame(raf);running=false;$("go").disabled=false;
  const names=parse();
  $("cnt").textContent=names.length+"명 준비됨"+($("names").value.split(/[\n,]+/).filter(s=>s.trim()).length>MAX?" (20명까지만 달려요)":"");
  const t=$("track");t.innerHTML="";
  $("result").hidden=true;$("msg").textContent=names.length<2?"이름을 2개 이상 적어주세요.":"출발선에서 준비 중!";
  const order=[...IMGS.keys()].sort(()=>Math.random()-.5);S=names.length>8?.7:1;
  runners=names.map((n,i)=>{
    const lane=document.createElement("div");lane.className="lane";lane.style.height=(96*S+2)+"px";
    if(i===0){const s=document.createElement("div");}
    lane.innerHTML='<div class="start"></div><div class="finish"></div>';
    const el=document.createElement("div");el.className="runner";
    const k=order[i%8],Sk="#222",f='fill="'+COL[k]+'" stroke="'+Sk+'" stroke-width="2.5"';
    const svg=document.createElement("div");
    svg.innerHTML='<svg width="84" height="70" viewBox="0 0 84 70" aria-hidden="true">'+'<image href="'+IMGS[k]+'" x="10" y="0" width="64" height="'+(64*FH[k])+'"/></svg>';
    const bib=document.createElement("div");bib.className="bib";bib.textContent=n;bib.title=n;
    el.append(svg.firstChild,bib);lane.append(el);t.append(lane);
    return{name:n,img:IMGS[k],el,x:0,v:0,done:false};
  });
  place(0);
}
function trackLen(){const w=$("track").clientWidth;return Math.max(100,w-84-40-12)}
function place(){runners.forEach(r=>r.el.style.transform=`translateX(${r.x}px) scale(${S})`)}
function start(){
  if(running||runners.length<2)return;
  setup();running=true;$("go").disabled=true;$("msg").textContent="달려라!!";
  runners.forEach(r=>r.el.classList.add("bounce"));
  const L=trackLen(),finish=[];let last=performance.now(),t0=last;
  runners.forEach(r=>{r.base=.8+Math.random()*.4;r.phase=Math.random()*6;r.freq=.8+Math.random()*1.6});
  function step(now){
    const dt=Math.min(.05,(now-last)/1000);last=now;const t=(now-t0)/1000;
    runners.forEach(r=>{
      if(r.done)return;
      r.v=(r.base+.55*Math.sin(t*r.freq+r.phase)+(Math.random()-.5)*.3)*(L/6.5);
      r.x+=Math.max(L*.03,r.v)*dt;
      if(r.x>=L){r.x=L;r.done=true;r.el.classList.remove("bounce");finish.push(r)}
    });
    place();
    if(finish.length<runners.length)raf=requestAnimationFrame(step);else end(finish);
  }
  raf=requestAnimationFrame(step);
}
function end(f){
  running=false;$("go").disabled=false;$("msg").textContent="결과가 나왔어요!";
  const ol=$("list");ol.innerHTML="";
  f.forEach((r,i)=>{
    const li=document.createElement("li");if(i===0)li.className="first";
    li.innerHTML='<span class="rank">'+(i+1)+'위</span><img alt=""><span class="nm"></span>';
    li.querySelector("img").src=r.img;li.querySelector(".nm").textContent=r.name;ol.append(li);
  });
  $("result").hidden=false;$("result").scrollIntoView({behavior:"smooth",block:"nearest"});
}

const MEL=[76,79,76,79,84,83,79,76, 77,81,77,81,84,81,77,74, 79,83,79,83,86,84,83,79, 84,79,76,79,72,0,72,0];
const BASS=[48,55,48,55, 53,60,53,60, 55,62,55,62, 48,55,48,55];
let ac,master,timer,stp=0,nxt=0,musicOn=false,muted=false;
function note(m,tm,d,type,v){if(!m)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(v,tm);g.gain.exponentialRampToValueAtTime(.001,tm+d);o.connect(g);g.connect(master);o.start(tm);o.stop(tm+d+.02)}
function sched(){while(nxt<ac.currentTime+.3){const s=stp%32;note(MEL[s],nxt,.17,"square",.04);if(s%2===0)note(BASS[s/2],nxt,.36,"triangle",.1);nxt+=.19;stp++}}
function startMusic(){try{if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.6;master.connect(ac.destination)}ac.resume();musicOn=true;nxt=ac.currentTime+.05;stp=0;clearInterval(timer);timer=setInterval(sched,50)}catch(e){musicOn=false}
  $("bgm").textContent=musicOn?"🔇 음악 끄기":"🎵 음악 켜기";$("bgm").setAttribute("aria-pressed",musicOn)}
function stopMusic(){musicOn=false;clearInterval(timer);$("bgm").textContent="🎵 음악 켜기";$("bgm").setAttribute("aria-pressed","false")}
$("bgm").onclick=()=>{if(musicOn){muted=true;stopMusic()}else{muted=false;startMusic()}};
document.addEventListener("click",()=>{if(!musicOn&&!muted)startMusic()},{once:true});
$("go").onclick=start;$("reset").onclick=setup;
$("names").addEventListener("input",()=>{if(!running)setup()});
addEventListener("resize",()=>{if(!running)setup()});
setup();
</script></body></html>
